name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t litho .
      - name: smoke test
        run: |
          docker run -d -p 8000:8000 --name litho litho
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf -F "file=@examples/well_25_11-24.las" "localhost:8000/predict" | python3 -c "import json,sys; b=json.load(sys.stdin); assert b['n_points'] > 1000, b; print(b['model_version'], b['summary'])"
